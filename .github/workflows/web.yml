name: 构建静态网页并发布到 web 分支

# 把 make web 的产物提交到 web 分支,供 Cloudflare Pages / EdgeOne Pages 绑定发布。
# 本文件已放在 .github/workflows/ 下,推送到 main 会直接触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Typst
        run: |
          curl -fL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # .webfonts/ 的字体走 LFS,不拉取只会拿到指针文件
          lfs: true
          # 保持默认 depth=1(浅克隆是刻意的,避免构建变慢)。代价:git log 拿不到
          # 逐文件的最后提交日,web_post.sh 会检测到浅克隆并整个不写 JSON-LD 的
          # dateModified 字段(宁可缺,也不发一个"每页都是构建当天"的错日期)。

      # 模板不再走 Typst Universe(那边只有 0.3.1),直接引 kych-net/UHTemp 的 main。
      # 模板一更新,下次构建就跟上;配置.typ 里的版本号由下一步改写对齐。
      - name: 检出模板(kych-net/UHTemp main)
        uses: actions/checkout@v4
        with:
          repository: kych-net/UHTemp
          ref: main
          path: .uhtemp

      # 用模板自带的 scripts/package 把仓库装成 <workspace>/.packages/preview/underhell/<版本>,
      # 再把配置.typ 的 @preview/underhell 版本号改成 typst.toml 里的实际版本。
      # 该脚本按 cwd 读 .typstignore、并按 cwd 遍历待打包文件,故必须在模板仓库根运行。
      - name: 装模板成本地包
        working-directory: .uhtemp
        run: |
          . scripts/setup
          bash scripts/package "$GITHUB_WORKSPACE/.packages/preview"
          echo "模板版本:${VERSION}"
          sed -i "s|@preview/underhell:[0-9.]*|@preview/underhell:${VERSION}|" "$GITHUB_WORKSPACE/配置.typ"

      # Typst 不支持 woff2,而 PDF 必须用 ttf/otf。CI 里没有系统字体,故把 .webfonts/*.woff2
      # 就地转成 ttf 放进临时目录,交给 TYPST_FONT_PATHS;否则 PDF 会回退成默认字体。
      # 转换出的字族名与 languages/zh.toml 的 [fonts] 一致(如 LXGW WenKai Mono)。
      - name: 字体转 ttf 供 PDF 使用
        run: |
          shopt -s nullglob
          woff2=(.webfonts/*.woff2)
          if [ ${#woff2[@]} -eq 0 ]; then
            echo "无 .webfonts/*.woff2,跳过(见 .webfonts/README.md)"
            exit 0
          fi
          if ! python3 -c "import fontTools, brotli" 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages fonttools brotli \
              || sudo apt-get install -y -qq python3-fonttools python3-brotli
          fi
          mkdir -p "$RUNNER_TEMP/uhfonts"
          python3 - <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont

          out = os.environ["RUNNER_TEMP"] + "/uhfonts"
          for f in sorted(glob.glob(".webfonts/*.woff2")):
              ft = TTFont(f)
              ft.flavor = None
              dst = os.path.join(out, os.path.basename(f)[:-len(".woff2")] + ".ttf")
              ft.save(dst)
              print(f"  {f} -> {os.path.basename(dst)} ({os.path.getsize(dst) // 1024}KB, {ft['name'].getDebugName(1)})")
          PY

      - name: 构建网页和PDF(make all)
        env:
          # 让 typst 从 .packages/ 取模板,而不是去下载 Universe 的包
          TYPST_PACKAGE_PATH: ${{ github.workspace }}/.packages
          # 让 typst 从临时目录取上一步转出的 ttf,PDF 才能用上自定义字体
          TYPST_FONT_PATHS: ${{ runner.temp }}/uhfonts
        run: make all

      # Typst 的 HTML 导出把 image() 内联成 base64,make web 收尾时 脚本/抽取内嵌图片.sh 已把
      # 这些图抽到 dist/图片/ 并把页面改成 /图片/… 外链。这一步兜住它够不着的情况:页面引用了
      # /图片/xxx 而产物目录下没有(比如手写 HTML 直接引源图),就从 LFS 拉下来的 图片/ 补过去。
      # 只复制被引用的文件,没被引用的源图不进 web 分支。
      - name: 复制外链图片到 dist
        run: |
          mkdir -p dist/图片
          grep -rho 'src="/图片/[^"]*"' dist --include='*.html' 2>/dev/null |
            sed 's|^src="/图片/||; s|"$||' | sort -u > /tmp/imgrefs.txt
          copied=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f "dist/图片/$f" ]; then continue; fi
            if [ -f "图片/$f" ]; then
              cp "图片/$f" "dist/图片/$f"
              echo "  补复制 $f"
              copied=$((copied + 1))
            else
              echo "::warning::页面引用 /图片/$f,但 图片/$f 不存在"
            fi
          done < /tmp/imgrefs.txt
          echo "外链图片引用 $(wc -l < /tmp/imgrefs.txt | tr -d ' ') 个,源目录补复制 $copied 个"
          ls -l dist/图片/

      # 源 .webfonts/ 有字体时把全字库 woff2 原地子集化(同名覆盖,@font-face 无需改动);
      # 没有字体则跳过,不影响构建。
      # 取字按"字族"分别做:从产物 CSS 读出 @font-face 与 --uh-*-font,再按选择器
      # (标签 / .class / [class^="…"])判断哪些 HTML 元素由哪个族渲染,每个字体只带
      # 自己真正要显示的字。正文族仍用全站并集,故体积不变、也不会缺字。
      # 任何环节解析不出来(CSS 缺失、@font-face 对不上、选择器形态不认识)一律退回
      # 全站并集;子集写完还会用 cmap 复核,缺一个字形就重做为全站并集——宁大勿坏。
      - name: 字体子集化(仅 .webfonts/ 有字体时)
        run: |
          if [ -z "$(find dist/webfonts -maxdepth 1 -name '*.woff2' 2>/dev/null)" ]; then
            echo "dist/webfonts 下无字体,跳过子集化(见 .webfonts/README.md)"
            exit 0
          fi
          if ! python3 -c "import fontTools, brotli" 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages fonttools brotli \
              || sudo apt-get install -y -qq python3-fonttools python3-brotli
          fi
          python3 - <<'PY'
          import html as htmllib, pathlib, re, subprocess, sys
          from html.parser import HTMLParser
          from fontTools.ttLib import TTFont

          dist = pathlib.Path("dist")

          def subset(src, chars, out):
              tf = pathlib.Path("/tmp/uh-web-chars.txt")
              tf.write_text("".join(sorted(chars)), encoding="utf-8")
              subprocess.run([sys.executable, "-m", "fontTools.subset", str(src),
                  f"--text-file={tf}",
                  "--flavor=woff2",
                  f"--output-file={out}",
                  "--layout-features=*",
                  "--no-hinting",
                  "--drop-tables+=DSIG",
              ], check=True)

          # 保底用字:整站 HTML 原文 + ASCII + 中文标点(正文族与一切回退都用它)
          text = "\n".join(
              p.read_text(encoding="utf-8") for p in sorted(dist.rglob("*.html"))
          )
          site = set(text) | set(htmllib.unescape(text))
          safe = {chr(c) for c in range(0x20, 0x7F)}
          safe |= set("　、。，．·…—～－／｜（）〈〉《》「」『』【】“”‘’※→←↑↓")

          # ---- 读网页 CSS(web_post.sh 已把内联样式抽到 /assets/underhell.css) ----
          css_file = dist / "assets" / "underhell.css"
          css = css_file.read_text(encoding="utf-8") if css_file.is_file() else ""
          if not css:
              pages = sorted(dist.rglob("*.html"))
              css = pages[0].read_text(encoding="utf-8") if pages else ""
          css = re.sub(r"/\*.*?\*/", "", css, flags=re.S)

          faces = {}  # 字族名 -> 字体文件名
          for m in re.finditer(r"@font-face\s*\{([^}]*)\}", css):
              b = m.group(1)
              fam = re.search(r'font-family:\s*"([^"]+)"', b)
              url = re.search(r'url\("([^"]+)"\)', b)
              if fam and url:
                  faces[fam.group(1)] = url.group(1).rsplit("/", 1)[-1]
          fvars = {}  # --uh-*-font -> 首选字族名
          for m in re.finditer(r":root\s*\{([^}]*)\}", css):
              for v in re.finditer(r"(--uh-[a-z-]*font)\s*:\s*([^;}]+)", m.group(1)):
                  first = re.search(r"['\"]([^'\"]+)['\"]", v.group(2))
                  if first:
                      fvars[v.group(1)] = first.group(1)
          # 选择器 -> 字族。只认这三种形态,认不出的族退回全站并集。
          rules, loose = [], set()
          for m in re.finditer(r"([^{}]+)\{([^{}]*)\}", css):
              sel, body = m.group(1).strip(), m.group(2)
              v = re.search(r"font-family:\s*var\((--uh-[a-z-]*font)", body)
              if not v:
                  continue
              fam = fvars.get(v.group(1))
              if not fam or fam not in faces:
                  continue  # 该变量指向系统字体,本来就不出自托管包
              for one in sel.split(","):
                  one = one.strip()
                  if re.fullmatch(r"[a-zA-Z][a-zA-Z0-9]*", one):
                      rules.append(("tag", one, fam))
                  elif re.fullmatch(r"\.[\w-]+", one):
                      rules.append(("class", one[1:], fam))
                  elif re.fullmatch(r'\[class\^="[^"]+"\]', one):
                      rules.append(("prefix", re.search(r'\^="([^"]+)"', one).group(1), fam))
                  else:
                      print(f"  [loose] 不认识的选择器 {one!r} -> {fam},该族退回全站用字")
                      loose.add(fam)
          for content in re.findall(r'content:\s*"([^"]*)"', css):
              safe |= set(htmllib.unescape(content))  # ::before/::after 生成的字符
          site |= safe

          # ---- 遍历 HTML:匹配到的元素,整棵子树的文本都记给该族(宁多勿漏) ----
          per_fam = {f: set() for f in faces}
          VOID = {"img", "br", "hr", "meta", "link", "input", "source", "track", "wbr",
                  "area", "base", "col", "embed", "param"}
          class Collect(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
              def handle_starttag(self, tag, attrs):
                  cls = [x for x in dict(attrs).get("class", "").split() if x]
                  for _, val in attrs:
                      if val:
                          site.update(val)  # 属性文本(如 title 提示)一并进保底集
                  if tag not in VOID:  # 空元素 HTML 里不闭合,压栈会污染后续祖先
                      self.stack.append((tag, cls))
              def handle_endtag(self, tag):
                  if self.stack:
                      self.stack.pop()
              def handle_data(self, data):
                  ch = set(data)
                  if not ch:
                      return
                  site.update(ch)
                  for tag, cls in self.stack:
                      for kind, arg, fam in rules:
                          if (kind == "tag" and tag == arg
                                  or kind == "class" and arg in cls
                                  or kind == "prefix" and any(s.startswith(arg) for s in cls)):
                              per_fam[fam].update(ch)
          Collect().feed(text)

          fam_of_file = {v: k for k, v in faces.items()}
          files = sorted((dist / "webfonts").glob("*.woff2"))
          print(f"字体 {len(files)} 个,能映射到字族的 {len([f for f in files if f.name in fam_of_file])} 个")

          before_all = after_all = 0
          for f in files:
              fam = fam_of_file.get(f.name)
              if fam is None:
                  chars, why = site, "无字族映射"
              elif fam in loose:
                  chars, why = site, "选择器不认识"
              else:
                  chars, why = per_fam[fam], f"字族 {fam}"
              chars = chars | safe
              before = f.stat().st_size
              tmp = pathlib.Path(str(f) + ".subset")
              subset(f, chars, tmp)
              # 复核:该要的字,只要源字体里有字形,子集里就必须在
              want = {ord(x) for x in chars} & set(TTFont(f).getBestCmap())
              got = set(TTFont(tmp).getBestCmap())
              if want - got:
                  print(f"  [retry] {f.name} 缺 {len(want - got)} 个字形,退回全站用字")
                  subset(f, site, tmp)
                  chars, why = site, "退回全站用字"
              tmp.replace(f)
              after = f.stat().st_size
              before_all += before
              after_all += after
              print(f"  {f.name}:{before // 1024}KB -> {after // 1024}KB({len(chars)} 字,{why})")
          print(f"字体合计:{before_all // 1024}KB -> {after_all // 1024}KB")
          PY

      - name: 推送到 web 分支
        working-directory: dist
        run: |
          git init -q -b web
          git config user.name "web-bot"
          git config user.email "web-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "网页构建:${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web